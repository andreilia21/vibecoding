services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: "on-failure:5"
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=${NGROK_DOMAIN}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_EDITOR_BASE_URL=${N8N_PUBLIC_URL}
      - WEBHOOK_URL=${N8N_PUBLIC_URL}/
      - N8N_PROXY_HOPS=1
      - NODE_ENV=production
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - JIRA_TODO_NAMES=${JIRA_TODO_NAMES:-To Do,К выполнению}
      - JIRA_IN_PROGRESS_NAMES=${JIRA_IN_PROGRESS_NAMES:-In Progress,Start Progress,В работе}
      - JIRA_IN_REVIEW_NAMES=${JIRA_IN_REVIEW_NAMES:-In Review,To Review,Review,Code Review,Ready for Review,В процессе проверки,На проверке}
      - JIRA_DONE_NAMES=${JIRA_DONE_NAMES:-Done,Complete,Completed,Closed,Resolved,Готово,Выполнено,Завершено,Закрыто}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
  ngrok:
    image: ngrok/ngrok:latest
    restart: "on-failure:5"
    command:
      - "http"
      - "n8n:5678"
      - "--url=${NGROK_DOMAIN}"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - n8n

  codex-worker:
    build:
      context: ./codex-worker
    restart: "on-failure:5"
    environment:
      - WORKER_PORT=3000
      - CODEX_HOME=/home/codex/.codex
      - CODEX_BIN=/app/node_modules/.bin/codex
      - REPOS_DIR=/work/repos
      - JOBS_DIR=/work/jobs
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_OWNER=${GITHUB_OWNER}
      - GITHUB_REPO=${GITHUB_REPO}
      - DEFAULT_BASE_BRANCH=${DEFAULT_BASE_BRANCH:-main}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - codex_home:/home/codex/.codex
      - codex_worker_data:/work
    depends_on:
      - n8n

volumes:
  n8n_data:
  codex_home:
  codex_worker_data:
